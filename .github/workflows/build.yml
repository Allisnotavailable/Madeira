# Locate the project file
PROJ_PATH=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

if [ -z "$PROJ_PATH" ]; then
  echo "Error: No .xcodeproj found in repository!"
  exit 1
fi

echo "Found Xcode project at: $PROJ_PATH"

# Extract scheme name or fall back to Madeira
SCHEME_NAME=$(xcodebuild -project "$PROJ_PATH" -list | awk '/Schemes:/{flag=1; next} /^[[:space:]]*$/{flag=0} flag' | xargs | awk '{print $1}')
if [ -z "$SCHEME_NAME" ]; then
  SCHEME_NAME="Madeira"
fi

echo "Using scheme: $SCHEME_NAME"

# Resolve absolute path for build directory
ABS_BUILD_DIR="$(pwd)/build/out"

# Execute xcodebuild
xcodebuild -project "$PROJ_PATH" \
  -scheme "$SCHEME_NAME" \
  -sdk iphoneos \
  -configuration Release \
  CODE_SIGNING_ALLOWED=NO \
  BUILD_DIR="$ABS_BUILD_DIR"
