name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install cmake ninja bison flex gnu-sed

      - name: Download & Setup Toolchains & Dependencies
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # Download required llvm-mingw compiler toolchain
          curl -L -O https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-macos-universal.tar.xz || true
          tar -xf llvm-mingw-*.tar.xz || true
          
          # Link toolchain so scripts expecting specific toolchain names can resolve it
          ln -s llvm-mingw-* llvm-mingw-20260421-ucrt-macos-universal || true
          
          # Clone FreeType dependency expected by win32u/fonts
          cd ..
          if [ ! -d "deps/freetype" ]; then
            mkdir -p deps
            git clone https://gitlab.freedesktop.org/freetype/freetype.git deps/freetype || true
          fi

      - name: Run Build Scripts
        run: |
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          export MINGW_TRIPLE="x86_64-w64-mingw32"
          
          find build -name "*.sh" -exec chmod +x {} \;
          
          # Run individual build scripts while suppressing non-critical test script exits
          for script in build/*/build.sh; do
            if [ -f "$script" ]; then
              echo "Executing $script..."
              bash "$script" || echo "Warning: $script experienced failures."
            fi
          done

      - name: Compile App with xcodebuild
        run: |
          xcodebuild -project Madeira.xcodeproj -scheme Madeira -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO BUILD_DIR=build/out

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/out/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/out/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
